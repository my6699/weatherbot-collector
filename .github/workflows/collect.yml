# Hourly data collection for Polymarket weather markets.
# Manual trigger available via the Actions page.

name: collect-data

on:
  schedule:
    - cron: "23 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: collect-data
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check Gamma API reachable from runner
        run: |
          code=$(curl -s -o /dev/null -w "%{http_code}" --max-time 25 \
            "https://gamma-api.polymarket.com/events?slug=highest-temperature-in-nyc-on-july-31-2026")
          echo "gamma-api HTTP $code"

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Collect data (one scan)
        env:
          # DeepSeek API key (primary LLM for risk advisor + ensemble fusion).
          # DeepSeek's free tier has a much higher rate limit than Gemini
          # (backtest: 89/89 calls succeed vs Gemini's 6/89 at 5s intervals).
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          # Use DeepSeek as the primary (and only) LLM provider.
          # Single-AI gating: DeepSeek reviews trades and its skip verdicts
          # are binding (LLM_GATE=true). No second opinion (LLM_PROVIDER2 unset).
          WEATHERBOT_LLM_PROVIDER: "deepseek"
          WEATHERBOT_LLM_GATE: "true"
          # Enable per-city rolling forecast bias correction (src/bias.ts).
          # Fixed 2026-08-03: applyBias had an inverted sign (forecast + bias
          # instead of forecast - bias), which pushed predictions AWAY from
          # actual — that's why it degraded accuracy when enabled before.
          # Backtest: per-city correction raises hit rate 18.3% -> 28.3% (LOO).
          WEATHERBOT_BIAS_ENABLED: "true"
          # LLM ensemble fusion: use DeepSeek to fuse ECMWF/GFS/ICON forecasts
          # instead of simple weighted average. Verified 2026-08-04: handles
          # model-disagreement scenarios well (Toronto test: picked ECMWF 18°C
          # over weighted-avg 19.2°C when GFS=24°C was an outlier).
          # Graceful fallback to weighted average when LLM is unavailable.
          WEATHERBOT_LLM_ENSEMBLE: "true"
        run: npm run scan:once

      - name: Commit and push collected data
        run: |
          git config user.name "weatherbot-collector"
          git config user.email "weatherbot-collector@users.noreply.github.com"
          git add data/
          if git diff --cached --quiet; then
            echo "No data changes to commit"
          else
            git commit -m "data: collect $(date -u +%Y-%m-%dT%H:%M:%SZ)"
            git push
          fi
