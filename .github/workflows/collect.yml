# 每小时定时搜集 Polymarket 天气市场数据，并把结果 commit 回仓库。
# 也可以手动触发（Actions 页面 "Run workflow"）。

name: collect-data

on:
  schedule:
    # 每小时的 :23 分（UTC）执行，错开整点避免与其它任务撞车
    - cron: "23 * * * *"
  workflow_dispatch:

permissions:
  contents: write

# 同一时间只允许一个搜集任务，避免并发 commit 冲突
concurrency:
  group: collect-data
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check Gamma API reachable from runner
        run: |
          code=$(curl -s -o /dev/null -w "%{http_code}" --max-time 25 \
            "https://gamma-api.polymarket.com/events?slug=highest-temperature-in-nyc-on-july-31-2026")
          echo "gamma-api HTTP $code"

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Collect data (one scan)
        run: npm run scan:once

      - name: Commit and push collected data
        run: |
          git config user.name "weatherbot-collector"
          git config user.email "weatherbot-collector@users.noreply.github.com"
          git add data/
          if git diff --cached --quiet; then
            echo "No data changes to commit"
          else
            git commit -m "data: collect $(date -u +%Y-%m-%dT%H:%M:%SZ)"
            git push
          fi
