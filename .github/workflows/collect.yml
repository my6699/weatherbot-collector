# Hourly data collection for Polymarket weather markets.
# Manual trigger available via the Actions page.

name: collect-data

on:
  schedule:
    - cron: "23 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: collect-data
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check Gamma API reachable from runner
        run: |
          code=$(curl -s -o /dev/null -w "%{http_code}" --max-time 25 \
            "https://gamma-api.polymarket.com/events?slug=highest-temperature-in-nyc-on-july-31-2026")
          echo "gamma-api HTTP $code"

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Collect data (one scan)
        env:
          # Free LLM risk advisor (Google Gemini). Optional: without the secret
          # the bot runs unchanged (LLM advisories are skipped, fail-open).
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          # Second-opinion LLM (DeepSeek). Optional: without it the bot falls
          # back to a single-model advisory.
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
        run: npm run scan:once

      - name: Commit and push collected data
        run: |
          git config user.name "weatherbot-collector"
          git config user.email "weatherbot-collector@users.noreply.github.com"
          git add data/
          if git diff --cached --quiet; then
            echo "No data changes to commit"
          else
            git commit -m "data: collect $(date -u +%Y-%m-%dT%H:%M:%SZ)"
            git push
          fi
