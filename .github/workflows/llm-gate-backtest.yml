# LLM 门控回测: 对历史已结算交易回放 AI skip/proceed 判断, 量化门控对胜率/PnL 的影响.
# 手动触发 (Actions 页面 → llm-gate-backtest → Run workflow). 不占 cron.

name: llm-gate-backtest

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  backtest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: "Run LLM gate backtest (dual AI: DeepSeek primary + Gemini secondary)"
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          # DeepSeek 作主模型 (避开 Gemini 免费档 15 RPM 限流导致的 primary null)
          WEATHERBOT_LLM_PROVIDER: "deepseek"
          # Gemini 作第二意见 (双AI门控, 任一skip即否决; 仅在 DeepSeek 主调成功后才调用)
          WEATHERBOT_LLM_PROVIDER2: "gemini"
          # bias 修正开启 (与实盘一致, 让 forecast_temp 上下文准确)
          WEATHERBOT_BIAS_ENABLED: "true"
        run: npx tsx scripts/backtest-llm-gate.ts

      - name: Commit and push report
        run: |
          git config user.name "weatherbot-collector"
          git config user.email "weatherbot-collector@users.noreply.github.com"
          git add data/processed/
          if git diff --cached --quiet; then
            echo "No report changes to commit"
          else
            git commit -m "backtest: LLM gate replay $(date -u +%Y-%m-%d)"
            git push
          fi
